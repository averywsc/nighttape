<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Tape</title>
<style>
:root{--bg:#030504;--ink:#e8efe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{color:var(--ink);font:16px/1.3 ui-monospace,"Courier New",monospace;text-shadow:1px 0 rgba(255,0,60,.45),-1px 0 rgba(0,220,255,.4);user-select:none}
#view{position:fixed;inset:0}
#gl{width:100%;height:100%;display:block;filter:contrast(1.2) saturate(.65) brightness(1.15) blur(.6px) sepia(.2)}
.fx{position:fixed;inset:0;pointer-events:none}
#noise{width:100%;height:100%;mix-blend-mode:overlay;opacity:.25}
#scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
#vig{background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.85) 100%)}
body.chase #vig{background:radial-gradient(ellipse at center,transparent 25%,rgba(150,0,0,.65) 100%)}
#adr{top:14%;left:0;right:0;text-align:center;font-size:34px;letter-spacing:.3em;color:#ff4a3a;opacity:0;font-weight:bold}
#band{position:fixed;left:0;right:0;height:36px;display:none;background:rgba(255,255,255,.07);backdrop-filter:blur(2px) hue-rotate(80deg) contrast(1.6);pointer-events:none}
.hud{position:fixed;padding:14px 18px;pointer-events:none;opacity:.7}
#rec{top:env(safe-area-inset-top,0px);left:0}
#rec b{color:#ff3b3b;animation:bl 1.2s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#tc{top:env(safe-area-inset-top,0px);right:0;text-align:right}
#date{bottom:env(safe-area-inset-bottom,0px);left:0;font-size:16px;opacity:.85}
#stat{bottom:env(safe-area-inset-bottom,0px);right:0;text-align:right}
#stam{display:inline-block;width:110px;height:8px;border:2px solid var(--ink);vertical-align:middle;margin-left:8px}
#stam i{display:block;height:100%;width:100%;background:var(--ink)}
body.boost #stam{box-shadow:0 0 10px var(--ink)}
#obj{bottom:calc(env(safe-area-inset-bottom,0px) + 4px);left:50%;transform:translateX(-50%);text-align:center;font-size:16px;opacity:.85;width:60%}
#toast{top:30%;left:0;right:0;text-align:center;transition:opacity .6s;opacity:0}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.55);padding:24px;cursor:pointer}
#msg h1{font-size:clamp(26px,5vw,42px);margin:0 0 14px;letter-spacing:.14em;font-weight:normal;opacity:.85}
#msg p{margin:8px 0;max-width:30em;font-size:16px;opacity:.65;font-weight:normal}
#msg small{opacity:.6;font-size:14px}
#stg{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:36em;margin-top:16px}
#msg button,#sel button{font:inherit;color:inherit;text-shadow:inherit;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.3);padding:8px 14px;cursor:pointer}
#msg button:hover,#sel button:hover{border-color:#ff4a3a}
#sel{position:fixed;inset:0;z-index:12;background:rgba(0,0,0,.92);display:none;overflow:auto;padding:24px}
#sel h1{font-weight:normal;letter-spacing:.14em;text-align:center;margin:8px 0 18px;font-size:clamp(24px,4vw,36px)}
#sel p{text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:1000px;margin:0 auto}
.card{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.03);padding:10px}
.card canvas{width:100%;display:block}
.card h3{margin:8px 0 2px;font-weight:normal}
.card p{font-size:14px;opacity:.7;margin:4px 0 10px;text-align:left}
#radar,#compass{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);width:72px;height:72px;pointer-events:none;display:none;opacity:.7;filter:drop-shadow(1px 0 rgba(255,0,60,.5)) drop-shadow(-1px 0 rgba(0,220,255,.45))}
#radar{left:18px}
#compass{left:104px}
#compass i{position:absolute;left:50%;top:50%;width:0;height:0;margin:-22px 0 0 -6px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:22px solid var(--ink);transform-origin:6px 22px}
#compass b{position:absolute;bottom:-8px;left:-14px;right:-14px;text-align:center;font-size:11px;font-weight:normal}
body.dead #noise{opacity:1!important}
#scare{filter:contrast(1.2) saturate(.65) brightness(1.15) blur(.6px) sepia(.2)}
#lore{bottom:13%;left:50%;transform:translateX(-50%);width:min(560px,86vw);font-size:15px;line-height:1.45;background:rgba(0,0,0,.55);opacity:0;transition:opacity .8s}
#lore small{opacity:.6;letter-spacing:.15em}
#thr{position:fixed;left:50%;top:50%;width:0;height:0;pointer-events:none;opacity:0}
#thr i{position:absolute;left:-16px;top:-17px;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:34px solid #ff2a1a;filter:drop-shadow(0 0 8px #ff2a1a)}
#pulse{box-shadow:inset 0 0 140px 40px rgba(190,0,0,.9);opacity:0}
</style>
</head>
<body>
<div id="view"><canvas id="gl"></canvas></div>
<canvas id="noise" class="fx" width="128" height="72"></canvas>
<canvas id="scare" class="fx" width="320" height="180" style="display:none;width:100%;height:100%"></canvas>

<div id="msg"></div>
<div id="sel"></div>

  'Day one. Dani says Eli’s truck was at the trailhead, doors unlocked, keys on the seat. Two years it’s been sitting there and nobody towed it. That bothers me more than I’m saying.',

  'Found Eli’s jacket in a tree. Not hanging on a branch. Pushed into the trunk, like the tree grew around it.',
  'It snowed last night. It’s October. This morning there were footprints around the tent, bare feet, walking in a circle. They’re all Jo’s size.',

];

{const gg=GND.geometry,pp=gg.attributes.position,cc=new Float32Array(pp.count*3);

{
  const gT=new THREE.CylinderGeometry(.16,.3,6,6); gT.translate(0,3,0);
  const gA=new THREE.ConeGeometry(2,5.5,7); gA.translate(0,6,0);
  const gB=new THREE.ConeGeometry(1.4,4,7); gB.translate(0,9,0);
  const mk=(w,h,draw,rx,ry)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t};
  const bark=mk(128,256,(x,w,h)=>{x.fillStyle='#4a3a2c';x.fillRect(0,0,w,h);for(let i=0;i<420;i++){const v=Math.random()*70|0;x.fillStyle=`rgb(${40+v},${30+v*.8|0},${22+v*.6|0})`;x.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*3,10+Math.random()*50)}for(let i=0;i<40;i++){x.fillStyle='rgba(0,0,0,.35)';x.fillRect(Math.random()*w,Math.random()*h,2,20+Math.random()*60)}},2,3);

  const d=new THREE.Object3D(), col=new THREE.Color(), col2=new THREE.Color();
  for(let i=0;i<N;i++){
    let x,z; do{x=(Math.random()*2-1)*(LIM+8);z=(Math.random()*2-1)*(LIM+8)}while(Math.hypot(x,z)<5||Math.random()>BW[0][biomeAt(x,z)]);
    const s=.8+Math.random()*.9; d.position.set(x,0,z); d.scale.set(s,s*(.9+Math.random()*.5),s); d.rotation.y=Math.random()*6; d.updateMatrix();
    const cv=.75+Math.random()*.5; col.setRGB(cv,cv,cv); col2.setRGB(cv*8,cv*3.2,cv*3.6); ms.forEach((m,k)=>{m.setMatrixAt(i,d.matrix);m.setColorAt(i,k&&biomeAt(x,z)===3?col2:col)}); trees.push({x,z,r:.3*s+.15});
  }

  /* more species: dark oak, birch, dead trees (the cones above are spruce) */
  const oakB=mk(128,256,(x,w,h)=>{x.fillStyle='#2a2018';x.fillRect(0,0,w,h);for(let i=0;i<500;i++){const v=Math.random()*40|0;x.fillStyle=`rgb(${22+v},${16+v*.8|0},${10+v*.6|0})`;x.fillRect(Math.random()*w,Math.random()*h,2+Math.random()*4,8+Math.random()*50)}},2,2);

  function species(bi,n,geos,mats,rad,sMin,sRange){
    const ms=geos.map((g,k)=>new THREE.InstancedMesh(g,mats[k],n));
    for(let i=0;i<n;i++){
      let x,z; do{x=(Math.random()*2-1)*(LIM+8);z=(Math.random()*2-1)*(LIM+8)}while(Math.hypot(x,z)<5||Math.random()>BW[bi][biomeAt(x,z)]);
      const s=sMin+Math.random()*sRange; d.position.set(x,0,z); d.scale.set(s,s*(.9+Math.random()*.3),s); d.rotation.y=Math.random()*6; d.updateMatrix();
      const cv=.8+Math.random()*.35, ak=biomeAt(x,z)===5?.3:1; col.setRGB(cv*ak,cv*ak,cv*ak);

  species(1,150,[cyl(.35,.6,3.4,7,1.7),ico(2.4,0,5.2,0,.8),ico(1.8,1.9,4.4,.7),ico(1.7,-1.7,4.6,-.9),ico(1.5,.3,6.6,-.4)],[mOB,mOL,mOL,mOL,mOL],.55,.9,.7);
  species(2,120,[cyl(.1,.17,7,6,3.5),ico(1.3,0,7,0),ico(.9,.7,6,.3),ico(.9,-.6,5.6,-.4)],[mBB,mBL,mBL,mBL],.18,.9,.5);
  species(3,170,[cyl(.12,.3,6.5,5,3.25),limb(2.6,.95,0,3.6),limb(2.6,-1.05,0,4.8),limb(2,0,.9,5.6)],[mDB,mDB,mDB,mDB],.25,.9,.6);

    m.l1.rotation.x=sw*.6; m.l2.rotation.x=-sw*.6; m.aL.rotation.x=-sw*.35+.15; m.aR.rotation.x=sw*.35+.15;
    if(d<1.15){end(false,m);return}
    if(d>90){const a=Math.random()*6.28;m.x=Math.max(-LIM,Math.min(LIM,P.x+Math.cos(a)*45));m.z=Math.max(-LIM,Math.min(LIM,P.z+Math.sin(a)*45))}
  }
  mons=mons.filter(m=>{if(m.rm){scene.remove(m.g);return false}return true});
  S.adr=mons.reduce((a,m)=>m.st==='chase'?Math.max(a,m.ct):a,0);
  if(S.adr>0)S.wasAdr=1; else if(S.wasAdr){S.wasAdr=0;S.cool=STAGES[S.stage].cd;say('I think I lost it. Keep moving.',3000)}
  document.body.classList.toggle('chase',S.adr>0);
  S.rg+=((S.adr>0?1:0)-S.rg)*(1-Math.exp(-dt*3)); const B=BIOMES[biomeAt(P.x,P.z)], dk=1-.1*S.stage, kk=1-Math.exp(-dt*.8);
  if(!S.bf){S.bf=B.fog.slice();S.gc=B.gnd.slice()}
  for(let k=0;k<3;k++){S.bf[k]+=(B.fog[k]-S.bf[k])*kk;S.gc[k]+=(B.gnd[k]-S.gc[k])*kk}
  const SG=STAGES[S.stage]; scene.fog.density+=(B.d*SG.fog*(1+(SG.wo?Math.max(0,Math.sin(S.t*.13-1))*.9:0))-scene.fog.density)*kk; hemi.intensity=.75*SG.lt; moon.intensity=.55*SG.lt; 
  S.lb=B.n; SN.position.set(P.x,0,P.z);
  {const a=SN.geometry.attributes.position.array;for(let i=1;i<a.length;i+=3){a[i]-=dt*1.6;if(a[i]<0)a[i]+=16}SN.geometry.attributes.position.needsUpdate=true}
  SN.material.opacity+=((B.n==='Snowfield'?.9:0)-SN.material.opacity)*kk;
  scene.fog.color.setRGB(S.bf[0]*dk+S.rg*.2,S.bf[1]*dk,S.bf[2]*dk-S.rg*.03); scene.background.copy(scene.fog.color);
  $('#adr').style.opacity=S.adr>0?1:0; $('#adr').textContent='RUN '+Math.ceil(S.adr);
  {const T=$('#thr');
    if(nm&&near<32){
      const dx=nm.x-P.x,dz=nm.z-P.z,rx=dx*Math.cos(S.yaw)-dz*Math.sin(S.yaw),fw=-(dx*Math.sin(S.yaw)+dz*Math.cos(S.yaw)),a=Math.atan2(rx,fw)*180/Math.PI;
      T.style.opacity=Math.min(1,(32-near)/18)*(.65+.35*Math.sin(S.t*(5+(32-near)*.6)));
      T.firstChild.style.transform='rotate('+a+'deg) translateY(-'+(Math.min(innerWidth,innerHeight)*.38)+'px)';
      S.mst=(S.mst||0)-dt; if(S.mst<=0){mstep(Math.max(-1,Math.min(1,rx/Math.max(near,8))),Math.min(1,(32-near)/26));S.mst=.26+near*.014}
    } else T.style.opacity=0;
    $('#pulse').style.opacity=S.fear*.6*(.7+.3*Math.sin(S.t*(6+S.fear*10)));}
  S.fear+=(Math.max(0,Math.min(1,1-(near-3)/28))-S.fear)*(1-Math.exp(-dt*2.5));
  if(AU.drone)AU.drone.gain.value=S.fear*.28; if(AU.hiss)AU.hiss.gain.value=.05+S.fear*.2;
  if(S.fear>.08){S.hb-=dt;if(S.hb<=0){tone(52,.55*S.fear+.1,.22);tone(46,.4*S.fear+.08,.22,.2);S.hb=1.15-S.fear*.8}}
  torch.intensity=3+Math.sin(S.t*37)*.06; if(Math.random()<S.fear*.06+(STAGES[S.stage].fk||0))torch.intensity*=.15; S.dark=Math.max(0,(S.dark||0)-dt); if(S.dark>0)torch.intensity=0;
}

/* ---- VHS layer ---- */
const nz=$('#noise'),nx=nz.getContext('2d'),nd=nx.createImageData(128,72);let nf=0;
function vhs(dt){
  if(S.sc>0)S.sc-=dt;
  const dead=S.status==='dead', f=(dead||S.sc>0)?1:S.fear;
  if(++nf%2===0||dead){for(let i=0;i<nd.data.length;i+=4){const v=Math.random()*255;nd.data[i]=nd.data[i+1]=nd.data[i+2]=v;nd.data[i+3]=255}nx.putImageData(nd,0,0)}
  if(!dead)nz.style.opacity=.32+f*.5;
  S.gl-=dt;
  if(S.gl<=0){
    if(Math.random()<.012+f*.12){S.bd={y:Math.random(),h:.03+Math.random()*.1,o:(Math.random()-.5)*.1*(1+f*2)};S.gl=.05+Math.random()*.15}
    else S.bd=null;
  }
  $('#view').style.transform=f>.05?`translate(${(Math.random()-.5)*f*3}px,${(Math.random()-.5)*f*2}px)`:'';
  $('#tc').textContent='PLAY '+fmt(S.t);
}

/* ---- loop ---- */
let last=performance.now();
function tick(now){
  const dt=Math.min((now-last)/1000,.05); last=now;
  if(S.run&&!S.pause)update(dt); else if(S.status==='menu'){S.t+=dt;cam.position.set(0,1.65,0);cam.rotation.set(0,Math.sin(S.t*.15)*.4,0)}
  else if(S.status==='dead'&&S.dcam){const k=1-Math.exp(-dt*2.2);let da=S.dcam.yw-cam.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));cam.rotation.y+=da*k;cam.rotation.x+=(S.dcam.pt-cam.rotation.x)*k}
  vhs(dt); R.render(scene,cam); glitch(); requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
